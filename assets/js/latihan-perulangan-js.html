<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Perulangan</title>
</head>
<body>
    <h2>Latihan Perulangan - Soal 1 & 2</h2>
    <p>Silakan buka <b>Inspect Element -> Console</b></p>

    <script>
        console.log("Soal 1: Cetak Angka");
        for (var i = 1; i <= 5; i++) {
            console.log(i);
        }
        console.log(" ");
        console.log("Soal 2: Hitung Mundur");
        var angka = 3;
        while (angka >= 1) {
            console.log(angka);
            angka--;
        }
        console.log("Start!");
    </script>
</body>
</html>
